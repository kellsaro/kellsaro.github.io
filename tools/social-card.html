<!doctype html>
<!--
  Source of the link-preview image (assets/img/social-card.png, 1200x630).
  Regenerate it with bin/social-card after editing this file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: #fbfcfb;
    color: #1f2933;
    display: flex;
    align-items: center;
    box-sizing: border-box;
    border-left: 18px solid #2f7d5d;
    padding: 0 88px 0 80px;
  }
  .text { flex: 1; }
  .name { font-size: 64px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.05; margin: 0; }
  .title { font-size: 34px; font-weight: 600; color: #2f7d5d; margin: 18px 0 0; }
  .stack { font-size: 27px; color: #3e4c59; margin: 30px 0 0; line-height: 1.4; }
  .stack strong { color: #1f2933; }
  .meta { font-size: 22px; color: #616e7c; margin: 34px 0 0; }
  .url { font-size: 24px; font-weight: 700; color: #1f2933; margin: 10px 0 0; }
  .photo {
    width: 280px; height: 280px; border-radius: 50%;
    object-fit: cover; margin-left: 56px;
    border: 8px solid #fff; box-shadow: 0 10px 40px rgba(31, 41, 51, .18);
  }
</style>
</head>
<body>
  <div class="text">
    <h1 class="name">Maykell Sánchez Romero</h1>
    <p class="title">Senior Software Engineer · 15+ years</p>
    <p class="stack"><strong>Ruby on Rails · React · Java</strong><br>AI-assisted engineering · moving toward Elixir</p>
    <p class="meta">UTC-5 · Open to remote roles</p>
    <p class="url">kellsaro.github.io</p>
  </div>
  <img class="photo" src="../assets/img/avatar-icon.png" alt="">
</body>
</html>
