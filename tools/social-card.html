<!doctype html>
<!--
  Source of the link-preview image (assets/img/social-card.png, 1200x630).
  Regenerate it with bin/social-card after editing this file.
  Same type and palette as the site: Public Sans, Source Serif 4, forest green.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Public Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: #FFFFFF;
    color: #1E2A28;
    display: flex;
    align-items: center;
    box-sizing: border-box;
    border-left: 18px solid #2F6B52;
    padding: 0 88px 0 80px;
  }
  .text { flex: 1; }
  .name { font-size: 66px; font-weight: 700; letter-spacing: -1.5px; line-height: 1.05; margin: 0; }
  .title { font-size: 34px; font-weight: 600; line-height: 1.25; color: #2F6B52; margin: 18px 0 0; }
  .summary { font-family: 'Source Serif 4', Georgia, serif; font-size: 29px; line-height: 1.45; margin: 30px 0 0; max-width: 680px; }
  .meta { font-size: 22px; font-weight: 500; color: #5E6B67; margin: 34px 0 0; }
  .url { font-size: 24px; font-weight: 700; color: #2F6B52; margin: 10px 0 0; }
  .photo { width: 280px; height: 280px; border-radius: 50%; object-fit: cover; margin-left: 56px; border: 1px solid #D5DEDA; }
</style>
</head>
<body>
  <div class="text">
    <h1 class="name">Maykell Sánchez Romero</h1>
    <p class="title">Senior Software Engineer<br>Ruby on Rails &amp; React</p>
    <p class="summary">15+ years building production systems, with a rigorous AI-assisted engineering workflow.</p>
    <p class="meta">Ecuador, UTC-5. Open to remote roles.</p>
    <p class="url">kellsaro.github.io</p>
  </div>
  <img class="photo" src="../assets/img/avatar-icon.png" alt="">
</body>
</html>
